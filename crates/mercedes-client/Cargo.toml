[package]
name = "mercedes-client"
description = "Client for the unofficial Mercedes-Benz mobile app API (unstable, isolated)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vehicle-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
prost = "0.14"
tokio = { workspace = true, features = ["net", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Same TLS stack reqwest already uses (rustls + aws-lc-rs + OS certificate verifier).
rustls = "0.23"
tokio-rustls = "0.26"
rustls-platform-verifier = "0.7"

[dev-dependencies]
tokio.workspace = true
wiremock = "0.6"

[lints]
workspace = true
