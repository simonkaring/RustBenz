[workspace]
resolver = "3"
members = [
    "crates/vehicle-core",
    "crates/mercedes-client",
    "crates/vehicle-storage",
    "crates/vehicle-ffi",
    "apps/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
vehicle-core = { path = "crates/vehicle-core" }
mercedes-client = { path = "crates/mercedes-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
